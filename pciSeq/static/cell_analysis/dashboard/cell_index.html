<!DOCTYPE html>
<html lang="en">
<head>
    <title>Cell Analysis Plot</title>
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <link rel="stylesheet" href="static/css/styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
</head>
<body>
    <div class="dashboard-container">
        <div class="plots-grid" role="main">
            <div id="gene-contribution-plot"></div>
            <div id="distance-probability-plot"></div>
            <div id="cell-gene-counts-plot"></div>
            <div id="gene-efficiency-plot"></div>
        </div>
        <div id="gene-selector"></div>
    </div>

    <script type="module">
        import { GeneContributionPlot } from './static/js/GeneContributionPlot.js';
        import { DistanceProbabilityPlot } from './static/js/distanceProbabilityPlot.js';
        import { GeneSelector } from './static/js/geneSelector.js';
        import { GeneExpressionPlot } from './static/js/GeneExpressionPlot.js';
        import { GeneEfficiencyPlot } from './static/js/GeneEfficiencyPlot.js';

        // Load both data files
        Promise.all([
            d3.json("../gene_loglik_contr.json?v=" + Date.now()),
            d3.json("../spot_dist.json?v=" + Date.now())
        ]).then(([geneData, spotData]) => {
            // Create shared tooltip
            const tooltip = d3.select("body").append("div")
                .attr("class", "tooltip")
                .style("opacity", 0);

            // Create the plots in the correct order
            const mainPlot = new GeneContributionPlot('gene-contribution-plot', geneData, tooltip);
            const distancePlot = new DistanceProbabilityPlot('distance-probability-plot', spotData, tooltip);
            const cellGenePlot = new GeneExpressionPlot('cell-gene-counts-plot', geneData, tooltip);
            const geneEfficiencyPlot = new GeneEfficiencyPlot('gene-efficiency-plot', geneData, tooltip);

            // Create the gene selector last
            const geneSelector = new GeneSelector('gene-selector', geneData.gene_names, selectedGenes => {
                // Convert array to Set for consistency
                const visibleGenes = new Set(selectedGenes);
                mainPlot.updateVisibleGenes(visibleGenes);
                distancePlot.updateVisibleGenes(visibleGenes);
                cellGenePlot.updateVisibleGenes(visibleGenes);
                geneEfficiencyPlot.updateVisibleGenes(visibleGenes);
            });

            // Add resize handler
            window.addEventListener('resize', () => {
                mainPlot.resize();
                distancePlot.resize();
                cellGenePlot.resize();
                geneEfficiencyPlot.resize();
            });

        }).catch(error => {
            console.error('Error loading data:', error);
            // Show error in all plot containers
            ['gene-contribution-plot', 'distance-probability-plot', 
             'cell-gene-counts-plot', 'gene-efficiency-plot'].forEach(id => {
                document.getElementById(id).innerHTML = 
                    `<div class="error-message">Error loading data: ${error.message}</div>`;
            });
        });
    </script>
</body>
</html>
