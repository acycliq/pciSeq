<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 372">
  <defs>
    <style>
      .ff { font-family: system-ui, -apple-system, 'Segoe UI', sans-serif; }
      .rtitle { fill: #ffffff; font-size: 16px; font-weight: 700; }
      .phead  { font-size: 12px; font-weight: 700; letter-spacing: 0.07em; }
      .psub   { font-size: 13px; }
      .name   { fill: #ffffff; font-size: 14px; font-weight: 700; }
      .q      { fill: #cbd5e0; font-size: 12.5px; }
      .badge  { fill: #ffffff; font-weight: 700; }
      .plus   { fill: #8a98a8; font-size: 22px; font-weight: 700; }
      .link   { stroke: #6b7f95; stroke-width: 4; fill: none; stroke-linecap: round; stroke-linejoin: round; }
    </style>
    <linearGradient id="rg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2f7d63" />
      <stop offset="1" stop-color="#1d5142" />
    </linearGradient>
  </defs>

  <!-- root -->
  <rect x="380" y="12" width="180" height="42" rx="11" fill="url(#rg)" stroke="#4fc3a1" stroke-width="1.5" />
  <text class="ff rtitle" x="470" y="39" text-anchor="middle">spot &#8594; cell score</text>

  <!-- connectors: root drops to a bus, bus feeds the two panels -->
  <path class="link" d="M 470,54 L 470,92" />
  <path class="link" d="M 122,92 L 586,92" />
  <path class="link" d="M 122,92 L 122,110" />
  <path class="link" d="M 586,92 L 586,110" />

  <!-- WHERE panel -->
  <rect x="24" y="110" width="196" height="250" rx="12" fill="rgba(91,155,213,0.06)" stroke="rgba(91,155,213,0.40)" stroke-width="1.2" />
  <text class="ff phead" x="122" y="134" text-anchor="middle" fill="#9fb6cc">WHERE ARE YOU?</text>
  <text class="ff psub"  x="122" y="150" text-anchor="middle" fill="#5f7488">geometry &#183; 1 term</text>

  <!-- WHAT panel -->
  <rect x="256" y="110" width="660" height="250" rx="12" fill="rgba(79,195,161,0.06)" stroke="rgba(79,195,161,0.40)" stroke-width="1.2" />
  <text class="ff phead" x="586" y="134" text-anchor="middle" fill="#9fd0c0">WHAT ARE YOU?</text>
  <text class="ff psub"  x="586" y="150" text-anchor="middle" fill="#5f8478">expression &#183; 4 facets</text>

  <!-- summation hints -->
  <text class="ff plus" x="238" y="264" text-anchor="middle">+</text>
  <text class="ff plus" x="426" y="264" text-anchor="middle">+</text>
  <text class="ff plus" x="586" y="264" text-anchor="middle">+</text>
  <text class="ff plus" x="746" y="264" text-anchor="middle">+</text>

  <!-- block 1: spatial (quantitative) -->
  <rect x="44" y="174" width="156" height="170" rx="10" fill="#15212e" stroke="rgba(91,155,213,0.50)" stroke-width="1.2" />
  <circle cx="122" cy="208" r="21" fill="#2f5f82" />
  <text class="ff badge" x="122" y="214" text-anchor="middle" font-size="15">&#8722;D</text>
  <text class="ff name"  x="122" y="252" text-anchor="middle">Spatial fit</text>
  <text class="ff q"     x="122" y="275" text-anchor="middle">How close is</text>
  <text class="ff q"     x="122" y="292" text-anchor="middle">the spot?</text>
  <text class="ff" x="122" y="326" text-anchor="middle" font-size="13" font-style="italic" fill="#7d96ab">geometry</text>

  <!-- block 2: alignment -->
  <rect x="272" y="174" width="148" height="170" rx="10" fill="#15241d" stroke="rgba(79,195,161,0.50)" stroke-width="1.2" />
  <circle cx="346" cy="208" r="21" fill="#2f7d63" />
  <text class="ff badge" x="346" y="216" text-anchor="middle" font-size="20">&#956;</text>
  <text class="ff name"  x="346" y="252" text-anchor="middle">Alignment</text>
  <text class="ff q"     x="346" y="275" text-anchor="middle">Does my type</text>
  <text class="ff q"     x="346" y="292" text-anchor="middle">make this gene?</text>
  <text class="ff" x="346" y="326" text-anchor="middle" font-size="13" font-style="italic" fill="#7fae9e">class &#8596; gene</text>

  <!-- block 3: gravity -->
  <rect x="432" y="174" width="148" height="170" rx="10" fill="#15241d" stroke="rgba(79,195,161,0.50)" stroke-width="1.2" />
  <circle cx="506" cy="208" r="21" fill="#2f7d63" />
  <text class="ff badge" x="506" y="216" text-anchor="middle" font-size="20">&#952;</text>
  <text class="ff name"  x="506" y="252" text-anchor="middle">Gravity</text>
  <text class="ff q"     x="506" y="275" text-anchor="middle">Am I a big,</text>
  <text class="ff q"     x="506" y="292" text-anchor="middle">active cell?</text>
  <text class="ff" x="506" y="326" text-anchor="middle" font-size="13" font-style="italic" fill="#7fae9e">cell size</text>

  <!-- block 4: enrichment -->
  <rect x="592" y="174" width="148" height="170" rx="10" fill="#15241d" stroke="rgba(79,195,161,0.50)" stroke-width="1.2" />
  <circle cx="666" cy="208" r="21" fill="#2f7d63" />
  <text class="ff badge" x="666" y="216" text-anchor="middle" font-size="20">&#947;</text>
  <text class="ff name"  x="666" y="252" text-anchor="middle">Enrichment</text>
  <text class="ff q"     x="666" y="275" text-anchor="middle">Have I got this</text>
  <text class="ff q"     x="666" y="292" text-anchor="middle">gene already?</text>
  <text class="ff" x="666" y="326" text-anchor="middle" font-size="13" font-style="italic" fill="#7fae9e">cell &#8596; gene</text>

  <!-- block 5: misread correction -->
  <rect x="752" y="174" width="148" height="170" rx="10" fill="#15241d" stroke="rgba(79,195,161,0.50)" stroke-width="1.2" />
  <circle cx="826" cy="208" r="21" fill="#2f7d63" />
  <text class="ff badge" x="826" y="216" text-anchor="middle" font-size="20">&#951;</text>
  <text class="ff name"  x="826" y="252" text-anchor="middle">Misread corr.</text>
  <text class="ff q"     x="826" y="275" text-anchor="middle">Is this gene</text>
  <text class="ff q"     x="826" y="292" text-anchor="middle">readable?</text>
  <text class="ff" x="826" y="326" text-anchor="middle" font-size="13" font-style="italic" fill="#7fae9e">vs background</text>
</svg>
