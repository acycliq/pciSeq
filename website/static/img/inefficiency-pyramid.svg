<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 460">
  <defs>
    <style>
      .tier { stroke: rgba(255,255,255,0.35); stroke-width: 1; stroke-linejoin: round; }
      .glyph { fill: #ffffff; font-family: system-ui, -apple-system, 'Segoe UI', sans-serif; font-size: 26px; font-weight: 600; }
      .name { fill: #cbd5e0; font-family: system-ui, -apple-system, 'Segoe UI', sans-serif; font-size: 14px; font-style: italic; }
      .desc { fill: #ffffff; font-family: system-ui, -apple-system, 'Segoe UI', sans-serif; font-size: 13px; opacity: 0.7; }
      .axis { fill: #718096; font-family: system-ui, -apple-system, 'Segoe UI', sans-serif; font-size: 13px; letter-spacing: 0.15em; }
      .leader { stroke: rgba(255,255,255,0.18); stroke-width: 1; stroke-dasharray: 2 4; }
    </style>
  </defs>

  <!-- granularity axis: line + explicit arrowhead, both centred on x=70 -->
  <line x1="70" y1="396" x2="70" y2="66" stroke="#4a5568" stroke-width="1.5" />
  <path d="M 70,54 L 76,68 L 70,64 L 64,68 Z" fill="#4a5568" />
  <text class="axis" transform="rotate(-90 90,230)" x="90" y="230" text-anchor="middle">GRANULARITY INCREASES</text>

  <!-- tiers: apex (most idiosyncratic) down to the systemic base -->
  <path class="tier" fill="#5fc394" d="M 300,60.0 L 342.9,141.0 L 257.1,141.0 Z" />
  <path class="tier" fill="#3fa07a" d="M 252.9,149.0 L 347.1,149.0 L 387.9,226.0 L 212.1,226.0 Z" />
  <path class="tier" fill="#2f7d63" d="M 207.9,234.0 L 392.1,234.0 L 432.9,311.0 L 167.1,311.0 Z" />
  <path class="tier" fill="#1f5a4a" d="M 162.9,319.0 L 437.1,319.0 L 477.9,396.0 L 122.1,396.0 Z" />

  <!-- leader lines from each tier's right edge to its label -->
  <line class="leader" x1="343" y1="100.5" x2="540" y2="100.5" />
  <line class="leader" x1="368" y1="187.5" x2="540" y2="187.5" />
  <line class="leader" x1="413" y1="272.5" x2="540" y2="272.5" />
  <line class="leader" x1="458" y1="357.5" x2="540" y2="357.5" />

  <!-- labels -->
  <g>
    <text x="550" y="96" class="glyph">&#947; <tspan class="name">(gamma)</tspan></text>
    <text x="550" y="116" class="desc">one gene, one cell, one class</text>

    <text x="550" y="183" class="glyph">&#952; <tspan class="name">(theta)</tspan></text>
    <text x="550" y="203" class="desc">one cell, one class (all genes)</text>

    <text x="550" y="268" class="glyph">&#951; <tspan class="name">(eta)</tspan></text>
    <text x="550" y="288" class="desc">one gene, all cells</text>

    <text x="550" y="353" class="glyph" font-size="20">Inefficiency</text>
    <text x="550" y="373" class="desc">the whole experiment at once</text>
  </g>
</svg>