<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500">
  <!-- Zen Dark-Friendly Palette -->
  <defs>
    <style>
      .line { stroke: #FFFFFF; stroke-width: 1; fill: none; opacity: 0.8; }
      .projection { stroke: #FFFFFF; stroke-width: 0.5; stroke-dasharray: 2 4; opacity: 0.4; }
      .label-main { fill: #FFFFFF; font-family: 'Inter', system-ui, sans-serif; font-size: 18px; font-weight: 300; letter-spacing: 0.1em; }
      .label-sub { fill: #A0AEC0; font-family: 'Inter', system-ui, sans-serif; font-size: 12px; font-style: italic; letter-spacing: 0.05em; }
      .dot { fill: #FFFFFF; }
      .accent-dot { fill: #48BB78; }
    </style>
  </defs>

  <!-- Level 4: GAMMA -->
  <path class="line" d="M380 80 L420 80 L400 60 Z" fill="rgba(255, 255, 255, 0.1)"/>
  <circle class="accent-dot" cx="400" cy="73" r="2"/>
  <text x="440" y="75" class="label-main">γ <tspan class="label-sub">(gamma)</tspan></text>
  <text x="440" y="95" class="label-sub">One gene, one cell.</text>

  <!-- Level 3: THETA -->
  <path class="line" d="M340 180 L460 180 L440 150 L360 150 Z" fill="rgba(255, 255, 255, 0.05)"/>
  <text x="480" y="165" class="label-main">θ <tspan class="label-sub">(theta)</tspan></text>
  <text x="480" y="185" class="label-sub">One cell, all genes.</text>

  <!-- Level 2: ETA -->
  <path class="line" d="M280 300 L520 300 L490 260 L310 260 Z" fill="rgba(255, 255, 255, 0.03)"/>
  <text x="540" y="280" class="label-main">η <tspan class="label-sub">(eta)</tspan></text>
  <text x="540" y="300" class="label-sub">One gene, all cells.</text>

  <!-- Level 1: SYSTEMIC -->
  <path class="line" d="M180 440 L620 440 L580 380 L220 380 Z" fill="rgba(255, 255, 255, 0.02)"/>
  <text x="640" y="410" class="label-main">Global <tspan class="label-sub">Inefficiency</tspan></text>
  <text x="640" y="430" class="label-sub">Rescales the whole experiment.</text>

  <!-- Connectors -->
  <line class="projection" x1="400" y1="80" x2="400" y2="380"/>
  <line class="projection" x1="340" y1="180" x2="180" y2="440"/>
  <line class="projection" x1="460" y1="180" x2="620" y2="440"/>

  <!-- Intersection Dots -->
  <circle class="dot" cx="400" cy="80" r="1.5"/>
  <circle class="dot" cx="340" cy="180" r="1.5"/>
  <circle class="dot" cx="460" cy="180" r="1.5"/>
  <circle class="dot" cx="280" cy="300" r="1.5"/>
  <circle class="dot" cx="520" cy="300" r="1.5"/>
  
  <!-- Side indicator -->
  <line x1="80" y1="60" x2="80" y2="440" stroke="#718096" stroke-width="1"/>
  <text x="70" y="250" transform="rotate(-90 70,250)" class="label-sub" style="fill:#718096; font-size: 14px;">GRANULARITY INCREASES</text>
</svg>