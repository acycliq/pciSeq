<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500">
  <defs>
    <style>
      .arc-band { fill: rgba(255, 255, 255, 0.05); stroke: rgba(255, 255, 255, 0.25); stroke-width: 1; stroke-linejoin: round; }
      .arc-highlight { fill: rgba(72, 187, 120, 0.12); stroke: #48BB78; stroke-width: 1.5; }
      .text-label { fill: #FFFFFF; font-family: system-ui, -apple-system, 'Segoe UI', sans-serif; font-size: 14px; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; }
      .center-title { fill: #FFFFFF; font-family: system-ui, -apple-system, 'Segoe UI', sans-serif; font-size: 12px; font-weight: 300; letter-spacing: 0.4em; opacity: 0.4; }
    </style>

    <!-- Paths for the labels to follow (centerline radius) -->
    <path id="txtPath1" d="M 400,90 A 160,160 0 0,1 560,250" />
    <path id="txtPath2" d="M 560,250 A 160,160 0 0,1 400,410" />
    <path id="txtPath3" d="M 400,410 A 160,160 0 0,1 240,250" />
    <path id="txtPath4" d="M 240,250 A 160,160 0 0,1 400,90" />
  </defs>

  <!-- Central title -->
  <text x="400" y="255" text-anchor="middle" class="center-title">THE VARIATIONAL LOOP</text>
  <circle cx="400" cy="250" r="100" fill="none" stroke="white" stroke-width="0.5" stroke-dasharray="2 6" opacity="0.2" />

  <g>
    <!-- Segment 1: Misread Density (top -> right) -->
    <path class="arc-band" d="M 416.6,60.7 A 190,190 0 0,1 585.1,207.3 L 598.8,204.1 L 565.0,250.0 L 522.8,221.7 L 536.4,218.5 A 140,140 0 0,0 412.2,110.5 Z" />
    <text class="text-label">
      <textPath href="#txtPath1" startOffset="50%" text-anchor="middle">Misread Density</textPath>
    </text>

    <!-- Segment 2: Warping Reference (right -> bottom, highlighted) -->
    <path class="arc-band arc-highlight" d="M 589.3,266.6 A 190,190 0 0,1 442.7,435.1 L 445.9,448.8 L 400.0,415.0 L 428.3,372.8 L 431.5,386.4 A 140,140 0 0,0 539.5,262.2 Z" />
    <text class="text-label">
      <textPath href="#txtPath2" startOffset="50%" text-anchor="middle">Warping Reference</textPath>
    </text>

    <!-- Segment 3: Cell Typing (bottom -> left) -->
    <path class="arc-band" d="M 383.4,439.3 A 190,190 0 0,1 214.9,292.7 L 201.2,295.9 L 235.0,250.0 L 277.2,278.3 L 263.6,281.5 A 140,140 0 0,0 387.8,389.5 Z" />
    <text class="text-label">
      <textPath href="#txtPath3" startOffset="50%" text-anchor="middle">Cell Typing</textPath>
    </text>

    <!-- Segment 4: Spot Assignment (left -> top) -->
    <path class="arc-band" d="M 210.7,233.4 A 190,190 0 0,1 357.3,64.9 L 354.1,51.2 L 400.0,85.0 L 371.7,127.2 L 368.5,113.6 A 140,140 0 0,0 260.5,237.8 Z" />
    <text class="text-label">
      <textPath href="#txtPath4" startOffset="50%" text-anchor="middle">Spot Assignment</textPath>
    </text>
  </g>
</svg>